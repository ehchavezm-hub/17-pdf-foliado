name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install PySide6 pikepdf reportlab pypdfium2 Pillow pyinstaller

      - name: Build exe
        working-directory: build
        run: pyinstaller --clean pdf-foliado.spec

      - name: Create EXE ZIP
        working-directory: build/dist
        run: Compress-Archive -Path pdf-foliado -DestinationPath pdf-foliado.zip -Force
        shell: powershell

      - name: Build portable package (Python + libs incluidos)
        shell: powershell
        run: |
          $version = "3.12.7"
          $url = "https://www.python.org/ftp/python/$version/python-$version-embed-amd64.zip"

          Write-Host "Descargando Python $version embebido..."
          Invoke-WebRequest -Uri $url -OutFile "python-embed.zip" -UseBasicParsing
          New-Item -ItemType Directory -Path "portable\python" -Force | Out-Null
          Expand-Archive -Path "python-embed.zip" -DestinationPath "portable\python" -Force
          Remove-Item "python-embed.zip"

          # Habilitar site-packages en Python embebido y agregar app root al path
          $pthFile = Get-ChildItem "portable\python" -Filter "*._pth" | Select-Object -First 1
          $pthContent = (Get-Content $pthFile.FullName) -replace '#import site', 'import site'
          $pthContent += ".."
          $pthContent | Set-Content $pthFile.FullName

          # Instalar pip
          Write-Host "Instalando pip..."
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py" -UseBasicParsing
          & "portable\python\python.exe" "get-pip.py" --no-warn-script-location -q
          Remove-Item "get-pip.py"

          # Instalar dependencias de la app
          Write-Host "Instalando dependencias..."
          & "portable\python\python.exe" -m pip install `
            PySide6 pikepdf reportlab pypdfium2 Pillow `
            --no-warn-script-location -q

          # Copiar código de la app
          Copy-Item -Path "pdf_foliado" -Destination "portable\pdf_foliado" -Recurse
          Copy-Item -Path "requirements.txt" -Destination "portable\requirements.txt"

          # Ordenar: todo el contenido interno va a la subcarpeta "app"
          # (el ._pth usa ".." relativo a python\, que sigue apuntando a app\)
          $dist = "pdf-foliado-portable"
          New-Item -ItemType Directory -Path "$dist\app" -Force | Out-Null
          Move-Item -Path "portable\*" -Destination "$dist\app"
          Remove-Item "portable"

          # Lanzador en la raiz (una linea por vez para evitar problemas YAML)
          $bat = "$dist\INICIAR PDF Foliado.bat"
          "@echo off"                                       | Set-Content  $bat -Encoding ASCII
          'cd /d "%~dp0app"'                               | Add-Content  $bat
          'set "PYTHONPATH=%~dp0app"'                      | Add-Content  $bat
          "python\python.exe pdf_foliado\main.py"          | Add-Content  $bat
          "if errorlevel 1 ("                              | Add-Content  $bat
          "    echo."                                      | Add-Content  $bat
          "    echo ERROR al iniciar. Presiona una tecla..."| Add-Content  $bat
          "    pause"                                      | Add-Content  $bat
          ")"                                              | Add-Content  $bat

          # LEEME en la raiz
          $leeme = "$dist\LEEME.txt"
          "PDF Foliado - version portable"                                  | Set-Content $leeme -Encoding UTF8
          ""                                                                | Add-Content $leeme
          "PARA ABRIR LA APLICACION:"                                       | Add-Content $leeme
          "  Doble clic en  'INICIAR PDF Foliado.bat'"                      | Add-Content $leeme
          ""                                                                | Add-Content $leeme
          "La carpeta 'app' contiene Python y el programa. No la modifiques" | Add-Content $leeme
          "ni la separes del archivo INICIAR."                              | Add-Content $leeme

          # Crear zip portable (contiene la carpeta pdf-foliado-portable\)
          Write-Host "Creando pdf-foliado-portable.zip..."
          Compress-Archive -Path $dist -DestinationPath "pdf-foliado-portable.zip" -Force
          Write-Host "Portable listo."

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Última versión"
          body: |
            ## Descargas

            | Archivo | Para quién |
            |---------|-----------|
            | **pdf-foliado.zip** | Cualquier PC Windows — sin Python (exe) |
            | **pdf-foliado-portable.zip** | PC sin permisos de instalación — Python incluido, solo descomprimir y ejecutar `INICIAR PDF Foliado.bat` |

            ### Opción 1 — EXE (más simple)
            1. Descargar `pdf-foliado.zip`
            2. Extraer en cualquier carpeta
            3. Ejecutar `pdf-foliado.exe`

            ### Opción 2 — Portable con Python incluido
            1. Descargar `pdf-foliado-portable.zip`
            2. Extraer en cualquier carpeta
            3. Abrir la carpeta `pdf-foliado-portable` y hacer doble clic en `INICIAR PDF Foliado.bat`
            _(No requiere instalar Python ni librerías)_
          prerelease: false
          make_latest: true
          files: |
            build/dist/pdf-foliado.zip
            pdf-foliado-portable.zip
