name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

      - name: Build EXE
        working-directory: build
        run: pyinstaller --clean pdf-foliado.spec

      - name: Create ZIP
        working-directory: build/dist
        run: |
          Compress-Archive -Path pdf-foliado -DestinationPath pdf-foliado.zip -Force
          $size = (Get-Item pdf-foliado.zip).length / 1MB
          Write-Host "ZIP size: $([math]::Round($size, 1)) MB"
          if ($size -gt 80) {
            Write-Error "ZIP exceeds 80 MB limit: $size MB"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-foliado-windows
          path: build/dist/pdf-foliado.zip
          retention-days: 30
